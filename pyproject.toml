[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humite"
version = "2.0.0"
description = "OmniX: A first jet and event model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "lightning>=2.5",
  "torchmetrics>=1.4",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.24",
  "awkward>=2.6",
  "pyarrow>=16",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# dataset converters, classification metrics, notebook, Comet logging, tests
extras = [
  "comet-ml>=3.39",
  "fastjet>=3.5",
  "matplotlib>=3.8",
  "pytest>=8.1",
  "scikit-learn>=1.5",
  "uproot>=5.4",
  "vector>=1.1",
]

[project.scripts]
humite-train = "humite.cli.train:main"

[tool.setuptools.packages.find]
include = ["humite*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
